name: Weekly maintenance check

on:
  schedule:
    - cron: '37 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  check-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # card-date check reads each page's git history
      - name: Check freshness, sources, links, deployment, and deliver issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weekly_maintenance.py --check-external --check-live --deliver --output /tmp/ai101-check
      - name: Retain receipts even when checks or delivery fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-receipt
          path: /tmp/ai101-check/
          if-no-files-found: error
          retention-days: 90
